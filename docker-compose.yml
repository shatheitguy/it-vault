services:
  db:
    image: mariadb:11
    container_name: itvault-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-itvault}
      MARIADB_USER: ${DB_USER:-itvault}
      MARIADB_PASSWORD: ${DB_PASS:-itvaultpass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-itvaultpass}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Swap `build: .` for `image: ghcr.io/<owner>/<repo>:latest` to run the
    # published image instead of building from source.
    build: .
    container_name: itvault-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-itvault}
      DB_USER: ${DB_USER:-itvault}
      DB_PASS: ${DB_PASS:-itvaultpass}
      # ITGUY_* are the old names, still read as a fallback so an existing
      # .env keeps working -- notably the secret, where falling back to a
      # fresh value would invalidate every session cookie on upgrade.
      # No default admin password on purpose: left unset, the container comes
      # up on the first-run setup wizard and you choose the credentials. Set
      # these in .env only for an unattended install, where the account is
      # created without anyone visiting the wizard.
      ITVAULT_ADMIN: ${ITVAULT_ADMIN:-${ITGUY_ADMIN:-}}
      ITVAULT_ADMIN_PASS: ${ITVAULT_ADMIN_PASS:-${ITGUY_ADMIN_PASS:-}}
      ITVAULT_SECRET: ${ITVAULT_SECRET:-${ITGUY_SECRET:-change-me-in-prod}}
    ports:
      - "5000:5000"
    volumes:
      - invoices_data:/app/invoices
      - backups_data:/app/backups

volumes:
  db_data:
  invoices_data:
  backups_data:
