# IT-Vault only. Bring your own MariaDB/MySQL and point this at it.
#
# Nothing here provisions a database: install MariaDB wherever you like (bare
# metal, another container, a managed instance), create an empty database and
# a user with rights on it, then either fill in the DB_* values below or leave
# them blank and enter them in the first-run setup wizard at /setup.
#
#   CREATE DATABASE itvault CHARACTER SET utf8mb4;
#   CREATE USER 'itvault'@'%' IDENTIFIED BY '<a-strong-password>';
#   GRANT ALL PRIVILEGES ON itvault.* TO 'itvault'@'%';
#
# The schema builds itself on first start, and migrates itself on upgrade.
#
# Updating, and why this file is the safe way to do it:
#
#     docker compose pull
#     docker compose up -d
#
# Compose recreates the containers from THIS file, so the volumes, the network
# and the DB_* values come back exactly as declared. Nothing to remember and
# nothing to retype. The equivalent by hand -- `docker rm -f itvault` then a
# fresh `docker run` -- loses whatever was only ever in the old container's
# environment, and the database credentials used to be exactly that: the setup
# wizard would then ask for a database on an install that already had one.
#
# Keep this file and your .env together, and treat them the way you would
# Nextcloud's config.php: they are the configuration, the containers are not.

services:
  web:
    # Pull the published image by default. Pin a release for anything real
    # (ITVAULT_TAG=1.6.0); "latest" moves under you. To build from a source
    # checkout instead, comment `image:` out and uncomment `build: .`.
    image: ghcr.io/shatheitguy/it-vault:${ITVAULT_TAG:-latest}
    # build: .
    container_name: itvault
    restart: unless-stopped
    environment:
      # Where your database lives. Blank is fine -- the setup wizard asks.
      # For a MariaDB running on this same host, use host.docker.internal
      # (Linux also needs the extra_hosts line below).
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-itvault}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      # Session signing key: left unset on purpose. The app generates a strong
      # random one on first start and keeps it in the data volume, which beats
      # any value shipped in a file -- a known secret lets anyone forge an
      # admin session cookie. Set it only to share one key across replicas.
      # ITVAULT_SECRET: ${ITVAULT_SECRET:-}
      #
      # No default admin password either: left unset, this comes up on the
      # first-run wizard and you choose the credentials. Set these only for an
      # unattended install, where the account is created with no wizard.
      ITVAULT_ADMIN: ${ITVAULT_ADMIN:-${ITGUY_ADMIN:-}}
      ITVAULT_ADMIN_PASS: ${ITVAULT_ADMIN_PASS:-${ITGUY_ADMIN_PASS:-}}
      # Keeps the generated session key and the saved DB pointer outside the
      # image, so replacing the image on update doesn't sign everyone out.
      ITVAULT_DATA_DIR: /app/data
      # Lets Settings -> General -> Check for Updates offer a working
      # "UPDATE NOW" button. IT-Vault can't replace its own container -- that
      # needs the host's Docker socket, which has no business inside a web
      # app -- so it asks the Watchtower container below to do it. Set the
      # token to any long random string and use the same one there.
      ITVAULT_WATCHTOWER_URL: ${ITVAULT_WATCHTOWER_URL:-http://watchtower:8080}
      ITVAULT_WATCHTOWER_TOKEN: ${ITVAULT_WATCHTOWER_TOKEN:-}
    ports:
      - "5000:5000"
    volumes:
      - itvault_data:/app/data
      - invoices_data:/app/invoices
      - backups_data:/app/backups
    # Linux only: lets host.docker.internal resolve to the Docker host, for a
    # MariaDB installed alongside this container. Harmless on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: one-click and automatic updates. Uncomment, set
  # ITVAULT_WATCHTOWER_TOKEN in .env, and `docker compose up -d`.
  #
  # Watchtower needs the Docker socket to recreate containers. That is
  # root-equivalent access to the host, which is why it lives here in a
  # small single-purpose container rather than in IT-Vault itself. It only
  # ever touches the container named on its command line.
  #
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_HTTP_API_UPDATE: "true"
  #     WATCHTOWER_HTTP_API_TOKEN: ${ITVAULT_WATCHTOWER_TOKEN:-}
  #     WATCHTOWER_CLEANUP: "true"
  #   # --interval 86400 also checks daily on its own, so updates land even
  #   # if nobody visits Settings. Drop it to only ever update on request.
  #   command: --interval 86400 itvault

  # Optional: let this file run the database too, for anyone who does not
  # already have one. Behind a profile so the default above stays "bring your
  # own":
  #
  #     docker compose --profile with-db up -d
  #
  # Then set DB_HOST=db in .env (the service name is the hostname on the
  # compose network) along with DB_USER, DB_PASS and DB_ROOT_PASSWORD.
  #
  # The credentials live in .env, not inside a container, so an update cannot
  # lose them -- which is the whole reason to prefer this over `docker run`.
  db:
    profiles: ["with-db"]
    image: mariadb:${MARIADB_TAG:-latest}
    container_name: itvault-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: ${DB_NAME:-itvault}
      MARIADB_USER: ${DB_USER:-itvault}
      MARIADB_PASSWORD: ${DB_PASS:-}
    volumes:
      - itvault_db:/var/lib/mysql
    # Deliberately not published: only the web service needs it, and it
    # reaches it by service name over the private compose network.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

# Named explicitly, and that matters more than it looks.
#
# Compose normally prefixes volumes with the project name, so in a directory
# called itvault these would become itvault_itvault_data and so on -- BRAND
# NEW, EMPTY volumes. Anyone moving an existing install onto this file would
# bring compose up and find every asset, ticket and setting apparently gone,
# while the real data sat untouched in the unprefixed volumes next to it.
#
# Pinning `name:` keeps the exact names install.sh creates, so this file is a
# drop-in for an install that already exists as well as a fresh one.
volumes:
  itvault_data:
    name: itvault_data
  invoices_data:
    name: invoices_data
  backups_data:
    name: backups_data
  itvault_db:
    name: itvault_db
