services:
  db:
    image: mariadb:11
    container_name: itguy-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-itguy_assets}
      MARIADB_USER: ${DB_USER:-itguy}
      MARIADB_PASSWORD: ${DB_PASS:-itguypass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-itguypass}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Swap `build: .` for `image: ghcr.io/<owner>/<repo>:latest` to run the
    # published image instead of building from source.
    build: .
    container_name: itguy-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-itguy_assets}
      DB_USER: ${DB_USER:-itguy}
      DB_PASS: ${DB_PASS:-itguypass}
      ITGUY_ADMIN: ${ITGUY_ADMIN:-admin}
      ITGUY_ADMIN_PASS: ${ITGUY_ADMIN_PASS:-admin123}
      ITGUY_SECRET: ${ITGUY_SECRET:-change-me-in-prod}
    ports:
      - "5000:5000"
    volumes:
      - invoices_data:/app/invoices
      - backups_data:/app/backups

volumes:
  db_data:
  invoices_data:
  backups_data:
