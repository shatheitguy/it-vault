{% set tpl = ix_lib.base.render.Render(values) %}

{% set it_vault_net = tpl.networks.create_internal("it-vault-net") %}
{% set c1 = tpl.add_container(values.consts.it_vault_container_name, "image") %}
{% do c1.add_network(it_vault_net) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{# IT-Vault brings no database of its own, so the app provides one. That is
   the difference between this and the compose file in the repository: on a
   NAS, "install MariaDB first" is where people stop. #}
{% set mariadb_config = {
  "user": values.consts.db_user,
  "root_password": values.it_vault.db_root_password,
  "password": values.it_vault.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.mariadb_data,
} %}
{% set mariadb_container = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{% do mariadb_container.container.add_network(it_vault_net) %}

{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{# The app answers on / once it is up; it starts even with no database so the
   setup wizard can ask for one, which is why the check is the web port rather
   than a database probe. #}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/"}) %}

{# Held back until the database actually answers, not merely exists: first
   start builds the schema, and racing that puts the setup wizard in front of
   someone who does not need it. #}
{% do c1.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}

{% do c1.environment.add_env("DB_HOST", values.consts.mariadb_container_name) %}
{% do c1.environment.add_env("DB_PORT", 3306) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("DB_PASS", values.it_vault.db_password) %}
{# Keeps the generated session key and the saved database pointer on the
   volume rather than in the image, so an update does not sign everyone out. #}
{% do c1.environment.add_env("ITVAULT_DATA_DIR", "/app/data") %}
{% do c1.environment.add_env("TZ", values.TZ) %}
{% if values.it_vault.public_url %}
  {% do c1.environment.add_env("ITVAULT_PUBLIC_URL", values.it_vault.public_url) %}
{% endif %}
{% if values.it_vault.cookie_secure %}
  {% do c1.environment.add_env("ITVAULT_COOKIE_SECURE", "1") %}
{% endif %}
{% do c1.environment.add_user_envs(values.it_vault.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{# Three paths, because they are three different kinds of thing to lose: the
   key and the database pointer, the files attached to assets, and the
   scheduled backups. #}
{% do c1.add_storage("/app/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage("/app/invoices", values.storage.invoices) %}
{% do perm_container.add_or_skip_action("invoices", values.storage.invoices, perms_config) %}

{% do c1.add_storage("/app/backups", values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do mariadb_container.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
