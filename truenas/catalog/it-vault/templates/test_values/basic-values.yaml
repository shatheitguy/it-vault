resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

it_vault:
  db_root_password: test
  db_password: test
  public_url: http://localhost:5000
  cookie_secure: false
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 5000

ix_volumes:
  data: /opt/tests/mnt/it-vault/data
  invoices: /opt/tests/mnt/it-vault/invoices
  backups: /opt/tests/mnt/it-vault/backups
  mariadb_data: /opt/tests/mnt/it-vault/mariadb_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  invoices:
    type: ix_volume
    ix_volume_config:
      dataset_name: invoices
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  mariadb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mariadb_data
      create_host_path: true
  additional_storage: []
