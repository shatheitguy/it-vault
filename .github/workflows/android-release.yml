name: Android build check

# Builds the Android app on every tag and on every change to android-app/, so
# a phone-side break is caught here rather than at release time.
#
# It does NOT publish. This used to try: it restored a keystore from secrets,
# signed an APK and created the GitHub Release itself. Three things were wrong
# with that. The secrets were never set, so it published releases with no APK
# attached. It fought with the release that is cut by hand with the notes
# somebody wrote. And it meant the app's signing key would have to live in a
# GitHub secret -- the key that lets an update install over an existing
# install, for an app people already have. That is a decision worth making
# deliberately, not by inheriting a workflow template.
#
# So: the release APK is still built and signed on the maintainer's machine
# (see RELEASING.md) and uploaded with `gh release upload`. What runs here is
# the compile, which is the part a person should not have to remember.
#
# Without keystore.properties the Gradle config simply omits the signing
# config, so assembleRelease produces an unsigned APK -- which is exactly what
# is wanted for a build check: it proves the code, resources and manifest are
# all still valid.

on:
  push:
    tags: [ 'v*' ]
    branches: [ 'main' ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' on purpose. The action's default is "tools
      # platform-tools", and `tools` was retired from the SDK repository --
      # sdkmanager exits 1 with "Failed to find package 'tools'", which is
      # what failed this job on every run for months. The runner image already
      # has the SDK and Gradle fetches the platform it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests first: they are seconds, and a failing one should not
      # be buried under a two-minute build that then succeeds.
      - name: Unit tests
        working-directory: android-app
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build the app (unsigned)
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon

      # Handy for checking a change on a device without a full release, and it
      # is unmistakably not the published build: a different signature means a
      # phone will refuse to install it over a real one.
      - name: Keep the unsigned APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: it-vault-unsigned-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
