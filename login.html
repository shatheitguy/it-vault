<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Guy - The Assets Manager — Sign in</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=20260901pro">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;
  transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
.card{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}
.box{position:relative;width:min(400px,100%);padding:40px 36px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.box{padding-bottom:32px}
.logoimg{display:block;max-height:44px;max-width:190px;width:auto;height:auto;object-fit:contain;margin:0 auto 16px}
.brand{font-weight:650;font-size:26px;letter-spacing:-.02em;text-align:center;color:var(--txt);margin:0 0 5px}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:30px}
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
.f input{width:100%;background:var(--bg1);border:1px solid var(--line);color:var(--txt);
  padding:11px 13px;border-radius:8px;font-family:var(--font);font-size:14px;outline:none;transition:.15s}
.f input::placeholder{color:var(--muted2)}
.f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{width:100%;margin-top:20px;padding:12px;border:none;border-radius:8px;cursor:pointer;
  font-family:var(--font);font-weight:600;font-size:14px;color:#04121f;background:var(--accent);transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.rem{display:flex;align-items:center;gap:9px;margin-top:16px;color:var(--muted);font-size:13px;cursor:pointer}
.rem input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;margin:0}
.err{color:var(--red);font-size:13px;text-align:center;min-height:0;margin-top:14px;line-height:1.4}
.shake{animation:sh .4s}@keyframes sh{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.sess{position:fixed;bottom:20px;left:0;right:0;z-index:10;text-align:center;color:var(--muted2);font-size:12px}
</style>
</head>
<body>
<div class="card"><div class="box" id="box">
  <img id="loginLogo" class="logoimg" src="/logo.png?t=1" alt="" style="display:none">
  <div class="brand" id="brand" data-t="Sha The IT Guy">Sha The IT Guy</div>
  <div class="sub" id="sub">Asset Management</div>
  <div class="f"><label for="u">Username</label><input id="u" placeholder="Enter your username" autocomplete="username"></div>
  <div class="f"><label for="p">Password</label><input id="p" type="password" placeholder="Enter your password" autocomplete="current-password"></div>
  <label class="rem"><input type="checkbox" id="r"> Keep me signed in (5 min)</label>
  <button class="btn" id="go">Sign in</button>
  <div class="err" id="e"></div>
</div></div>
<div class="sess">Session timeout: 5 minutes</div>
<script>
/* ---- theme preset + branding (follows dashboard customization engine) ---- */
let savedTheme='dark';
function resolveTheme(t){return t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;}
function applyTheme(t){savedTheme=t;}
/* Actual light/dark is derived from the real background color inside applyCustomVars
   (single source of truth, matching the main app) — applyTheme just tracks the
   'system' preference so the matchMedia listener below knows when to react. */
/* Same color math as the main app's theme engine (app.js applyCustomVars),
   ported here so the login page always gets correct, readable colors for
   whatever background/accent the admin picked — not just a binary light/dark class. */
function hex6(v, fb){
  const s=String(v==null?'':v).trim();
  if(/^#[0-9a-fA-F]{6}$/.test(s)) return s.toLowerCase();
  if(/^#[0-9a-fA-F]{3}$/.test(s)) return ('#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3]).toLowerCase();
  return fb;
}
function hexRgb(h){ const s=hex6(h,'#000000'); return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]; }
function rgba(h,a){ const c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function shade(h,amt){ const c=hexRgb(h); const f=n=>{const v=Math.max(0,Math.min(255,Math.round(n+255*amt)));return v.toString(16).padStart(2,'0');}; return '#'+f(c[0])+f(c[1])+f(c[2]); }
function isLightHex(h){ const c=hexRgb(h); return (c[0]*0.299+c[1]*0.587+c[2]*0.114)>150; }
function onBg(bgHex){ return isLightHex(bgHex)?'#16202e':'#e6edf6'; }
function muteFor(bgHex,k){ const light=isLightHex(bgHex); if(light) return k==='muted'?'#5d6b82':'#8595ad'; return k==='muted'?'#8a98b0':'#5d6b82'; }
function contrastRatio(a,b){ const L=h=>{const [r,g,bl]=hexRgb(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*r+0.7152*g+0.0722*bl;}; const la=L(a),lb=L(b); const hi=Math.max(la,lb),lo=Math.min(la,lb); return (hi+0.05)/(lo+0.05); }
function ensureAccentVisible(accent,surface){ if(contrastRatio(accent,surface)>=2.2) return accent; const a=hexRgb(accent),s=hexRgb(surface); const mix=a.map((v,i)=>Math.round(v*0.65+s[i]*0.35)); return '#'+mix.map(v=>v.toString(16).padStart(2,'0')).join(''); }
function applyCustomVars(s){
  if(!s) return;
  const bgType=s.bg_type==='gradient'?'gradient':'solid';
  const bgRaw=String(s.bg||'').trim();
  let bgA='#0a0d13', bgB='#121826';
  if(bgType==='gradient'){
    const found=bgRaw.match(/#[0-9a-fA-F]{3,6}/g)||[];
    bgA=hex6(found[0],'#0a0d13'); bgB=hex6(found[1],'#121826');
  }
  const baseHex=bgType==='gradient'?bgA:hex6(bgRaw,'#0a0d13');
  const bgValue=bgType==='gradient'?('linear-gradient(135deg, '+bgA+', '+bgB+')'):baseHex;
  const surface=hex6(s.comp_bg,'#121826');
  const light=isLightHex(baseHex);
  const surfaceLight=isLightHex(surface);
  const accent=ensureAccentVisible(hex6(s.accent,'#ff3b30'), surface);
  const accent2=ensureAccentVisible(hex6(s.accent2,'#c0392b'), surface);
  const radius=Math.max(0,Math.min(24,parseInt(s.radius,10)||12));
  const r=document.documentElement.style;
  r.setProperty('--bg', bgValue);
  r.setProperty('--bg1', light?shade(baseHex,-0.04):shade(baseHex,0.03));
  r.setProperty('--surface', surface);
  r.setProperty('--surface2', surfaceLight?shade(surface,-0.04):shade(surface,-0.02));
  r.setProperty('--line', surfaceLight?shade(surface,-0.14):shade(surface,0.10));
  r.setProperty('--line2', surfaceLight?shade(surface,-0.22):shade(surface,0.16));
  r.setProperty('--txt', onBg(baseHex));
  r.setProperty('--muted', muteFor(baseHex,'muted'));
  r.setProperty('--muted2', muteFor(baseHex,'muted2'));
  r.setProperty('--accent', accent);
  r.setProperty('--accent2', accent2);
  r.setProperty('--accent-soft', rgba(accent,0.14));
  r.setProperty('--radius', radius+'px');
  document.body.classList.toggle('light', light);
}
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(savedTheme==='system')applyTheme('system');});}
(async()=>{
  try{
    const b=await (await fetch('/api/branding')).json();
    const name=b.app_name||'Sha The IT Guy';
    document.title=name+' — Sign in';
    const brand=document.getElementById('brand');
    brand.textContent=name; brand.setAttribute('data-t',name);
    const lg=document.getElementById('loginLogo');
    if(lg){ lg.src='/logo.png?t='+Date.now(); lg.style.display=''; }
    applyCustomVars(b);
    applyTheme(b.theme||'dark');
    window.__matrixOn = !!b.matrix_on && !document.body.classList.contains('light');
  }catch(e){ applyTheme('dark'); window.__matrixOn=true; }
})();
async function login(){
  const eEl=document.getElementById('e');
  if(location.protocol==='file:'){
    eEl.textContent='Open this page at http://localhost:5000 — not the file directly.';
    document.getElementById('box').classList.add('shake');
    setTimeout(()=>document.getElementById('box').classList.remove('shake'),400);
    return;
  }
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p,remember:document.getElementById('r').checked})});
    if(r.ok){
      const me=await fetch('/api/me'); const j=await me.json();
      if(j.user){ window.location.replace('/'); }
      else{ eEl.textContent='Session could not be started. Please try again.'; }
    } else {
      let msg='Incorrect username or password.';
      try{ const d=await r.json(); if(d.error) msg=d.error; }catch(e){}
      eEl.textContent=msg;
      document.getElementById('box').classList.add('shake');
      setTimeout(()=>document.getElementById('box').classList.remove('shake'),400);
    }
  }catch(err){
    eEl.textContent='Cannot reach the server. Is it running on port 5000?';
  }
}
document.getElementById('go').onclick=login;
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
